# ---------------------------------------------------------------- papers / reports
- id: dvorkin-2005-attenuation
  title: "Mavko, Dvorkin & Walls (2005) A Rock Physics and Attenuation Analysis of a Well from the Gulf of Mexico (SEG abstract, NETL)"
  url: https://netl.doe.gov/sites/default/files/2018-04/2005_SEG_Dvorkin.pdf
  kind: paper
  topic: fluid
  free: true
  license: "unknown (US DOE-hosted)"
  size: "184 KB"
  level: advanced
  verified: true
  summary: Shows from well modelling that P-wave attenuation (1/Qp) is large only in the gas sand, while S-wave attenuation stays small everywhere. The ratio Qp^-1/Qs^-1 is about 1 in wet rock and large in gas, so it can act as a hydrocarbon indicator.
  concepts: [attenuation, qp-qs-ratio, gas-sand, soft-sand-model]

- id: netl-nt42243-report
  title: "DOE/NETL Final Report NT42243 - P- and S-wave attenuation for reservoir characterization (Rock Solid Images)"
  url: https://www.netl.doe.gov/sites/default/files/2018-04/NT42243_FinalRpt.pdf
  kind: paper
  topic: fluid
  free: true
  license: "US Government report (public)"
  size: null
  level: advanced
  verified: true
  summary: Full project report behind the Dvorkin and Mavko attenuation work. It concludes that seismic attenuation can be linked to gas reservoirs and used as a reconnaissance tool.
