  kind: lecture-notes
  topic: leak
  free: true
  license: "CC-BY-SA 4.0"
  size: null
  level: beginner
  verified: true
  summary: "Short plain-language overview: pulse, backscatter, gauge length about equal to pulse length, typical range 40-50 km, ~10 m resolution from a 100 ns pulse, and applications including pipeline leak monitoring."
  concepts: [das-basics, gauge-length, sensing-range, spatial-resolution, das-applications]

