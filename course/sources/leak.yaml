# ---------------------------------------------------------------- DAS fundamentals / reviews
- id: xenaki-das-overview-2025
  title: "Overview of distributed acoustic sensing: Theory and ocean applications (Xenaki, Gerstoft, Williams, Abadi)"
  url: "https://arxiv.org/html/2502.18344v3"
  kind: paper
  topic: leak
  free: true
  license: "CC-BY 4.0"
  size: null
  level: intermediate
  verified: true
  summary: "Tutorial-style review of DAS physics, from laser pulse and Rayleigh backscatter to phase, strain and strain rate, with real acquisition parameters (pulse width, gauge length, 2 m channels, 200-500 Hz) and processing steps (band-pass, f-k, beamforming). The best single starting point for the theory."
  concepts: [rayleigh-backscatter, phase-to-strain, gauge-length, channel-spacing, pulse-repetition-rate, fk-filtering, strain-rate]

- id: wikipedia-das
  title: "Distributed acoustic sensing (Wikipedia)"
