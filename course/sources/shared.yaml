- id: mlreal-paper
  title: "Alkhalifah, Wang, Ovcharenko (2021), MLReal: Bridging the gap between training on synthetic data and real data applications"
  url: "https://arxiv.org/abs/2109.05294"
  kind: paper
  topic: shared
  free: true
  license: "arXiv non-exclusive"
  size: null
  level: advanced
  verified: true
  summary: "Domain adaptation for waveform ML: cross-correlate inputs with a reference trace and convolve with autocorrelations from the other domain so synthetic-trained networks work on field data."
  concepts: [synthetic-to-real, domain-adaptation, cross-correlation]

