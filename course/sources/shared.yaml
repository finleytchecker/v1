- id: convnetquake-paper
  title: "Perol, Gharbi, Denolle (2018), Convolutional neural network for earthquake detection and location"
  url: "https://arxiv.org/abs/1702.02073"
  kind: paper
  topic: shared
  free: true
  license: "arXiv non-exclusive"
  size: null
  level: intermediate
  verified: true
